# Publishes the website in site/ to GitHub Pages (thomaslrw.github.io/CodeWidget) on every push to main.
# One-time setup: repo Settings > Pages > Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Put the site together
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp src/code.js _site/code.js
          cp assets/icon.png _site/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
