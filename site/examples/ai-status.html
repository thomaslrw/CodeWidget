<!-- AI status: is Claude, ChatGPT, GitHub or Vercel having problems right now? Live from their official status pages, checked every 2 minutes. Click a service to open its status page. -->
<div class="w">
  <div class="head">
    <div><div class="t">AI status</div><div class="s" id="sub">Checking...</div></div>
    <button id="refresh" title="Check now">↻</button>
  </div>
  <div class="stats">
    <div><b id="up">-</b><span>operational</span></div>
    <div><b id="issues">-</b><span>with issues</span></div>
    <div><b id="next">2:00</b><span>next check</span></div>
  </div>
  <div class="list" id="list"></div>
</div>
<style>
  * { box-sizing: border-box; }
  .w {
    height: 100vh; padding: 16px 18px; border-radius: 20px; background: #0f1012; color: #eef0f3;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px;
    border: 1px solid #212328; overflow: hidden;
  }
  .head { display: flex; justify-content: space-between; align-items: center; }
  .t { font-weight: 700; font-size: 16px; }
  .s { color: #8a8d95; font-size: 12px; margin-top: 2px; }
  button { width: 30px; height: 30px; border-radius: 50%; background: #1c1d21; color: #e6e7ea; border: 1px solid #2b2d33; cursor: pointer; font-size: 15px; }
  button:hover { border-color: #55575f; }
  button.spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stats { display: flex; gap: 22px; padding: 2px 0 10px; border-bottom: 1px solid #1d1f23; }
  .stats b { display: block; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stats span { color: #8a8d95; font-size: 10.5px; }
  .list { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
  a { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid #1d1f23; color: inherit; text-decoration: none; }
  a:last-child { border-bottom: 0; }
  a:hover .name { text-decoration: underline; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 13.5px; }
  .desc { color: #8a8d95; font-size: 11.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state { font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #4b4f57; }
  .ok .dot { background: #39d353; box-shadow: 0 0 8px rgba(57, 211, 83, .55); } .ok .state { color: #39d353; }
  .minor .dot { background: #f5b544; box-shadow: 0 0 8px rgba(245, 181, 68, .55); animation: pulse 1.8s ease-in-out infinite; } .minor .state { color: #f5b544; }
  .major .dot { background: #f2555a; box-shadow: 0 0 8px rgba(242, 85, 90, .6); animation: pulse 1s ease-in-out infinite; } .major .state { color: #f2555a; }
  .unknown .state { color: #8a8d95; }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
<script>
  // Each service's official status page (they all allow widgets to read them).
  const SERVICES = [
    { name: "Claude", url: "https://status.claude.com" },
    { name: "ChatGPT", url: "https://status.openai.com" },
    { name: "GitHub", url: "https://www.githubstatus.com" },
    { name: "Vercel", url: "https://www.vercel-status.com" },
  ];
  const LEVEL = { none: "ok", minor: "minor", major: "major", critical: "major", maintenance: "minor" };
  const LABEL = { ok: "Operational", minor: "Degraded", major: "Outage", unknown: "Unknown" };
  const EVERY = 120;
  const list = document.getElementById("list");
  const btn = document.getElementById("refresh");

  const rows = SERVICES.map((s) => {
    const a = document.createElement("a");
    a.href = s.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.className = "unknown";
    a.innerHTML = `<span class="dot"></span><div class="info"><div class="name"></div><div class="desc">Checking...</div></div><span class="state"></span>`;
    a.querySelector(".name").textContent = s.name;
    list.append(a);
    return a;
  });

  let left = EVERY;
  async function check() {
    btn.classList.add("spin");
    const results = await Promise.all(SERVICES.map(async (s) => {
      try {
        const j = await (await fetch(`${s.url}/api/v2/status.json`, { cache: "no-store" })).json();
        return { level: LEVEL[j.status.indicator] || "unknown", text: j.status.description };
      } catch {
        return { level: "unknown", text: "Couldn't check" };
      }
    }));
    results.forEach((r, i) => {
      rows[i].className = r.level;
      rows[i].querySelector(".desc").textContent = r.text;
      rows[i].querySelector(".state").textContent = LABEL[r.level];
    });
    document.getElementById("up").textContent = results.filter((r) => r.level === "ok").length;
    document.getElementById("issues").textContent = results.filter((r) => r.level === "minor" || r.level === "major").length;
    document.getElementById("sub").textContent = `Live · checked ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
    btn.classList.remove("spin");
    left = EVERY;
  }
  setInterval(() => {
    left -= 1;
    if (left <= 0) check();
    document.getElementById("next").textContent = `${Math.floor(Math.max(left, 0) / 60)}:${String(Math.max(left, 0) % 60).padStart(2, "0")}`;
  }, 1000);
  btn.onclick = check;
  check();
</script>
