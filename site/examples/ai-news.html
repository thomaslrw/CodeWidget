<!-- AI news: the most talked-about AI stories from the last 2 days (Hacker News), refreshed every 15 minutes. Click a story to open it. -->
<div class="w">
  <div class="head">
    <div><div class="t">AI news</div><div class="s" id="sub">Top stories, last 48 hours</div></div>
    <button id="refresh" title="Refresh">↻</button>
  </div>
  <div class="list" id="list"><div class="msg">Loading...</div></div>
</div>
<style>
  * { box-sizing: border-box; }
  .w {
    height: 100vh; padding: 16px; border-radius: 20px; background: #0f1012; color: #f0f1f3;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; gap: 10px;
    border: 1px solid #3a2a1c; overflow: hidden;
  }
  .head { display: flex; justify-content: space-between; align-items: center; }
  .t { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .t::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #ff8a3d; box-shadow: 0 0 10px #ff7a1a; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .s { color: #8a8d95; font-size: 12px; margin-top: 2px; }
  button { width: 30px; height: 30px; border-radius: 50%; background: #1c1d21; color: #e6e7ea; border: 1px solid #2b2d33; cursor: pointer; font-size: 15px; }
  button:hover { border-color: #ff8a3d; color: #ff8a3d; }
  button.spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  a { display: flex; gap: 10px; padding: 9px 4px; border-bottom: 1px solid #1d1f23; color: inherit; text-decoration: none; }
  a:hover .title { color: #ffb27a; }
  .rank { color: #ff8a3d; font-weight: 700; font-size: 12px; width: 16px; flex: none; padding-top: 1px; }
  .title { font-size: 13px; line-height: 1.35; }
  .meta { color: #8a8d95; font-size: 11px; margin-top: 3px; }
  .msg { color: #8a8d95; font-size: 13px; padding: 10px 4px; }
</style>
<script>
  const AI = /\b(AI|A\.I\.|LLMs?|OpenAI|Anthropic|Claude|ChatGPT|GPT[-\w.]*|Gemini|DeepMind|Mistral|Llama|Copilot|Grok|agentic)\b/i;
  const list = document.getElementById("list");
  const btn = document.getElementById("refresh");
  const ago = (s) => { const h = Math.round((Date.now() / 1000 - s) / 3600); return h < 1 ? "just now" : h < 24 ? `${h}h ago` : `${Math.round(h / 24)}d ago`; };
  const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return "news.ycombinator.com"; } };

  async function load() {
    btn.classList.add("spin");
    const since = Math.floor(Date.now() / 1000) - 48 * 3600;
    const terms = ["AI", "LLM", "OpenAI", "Anthropic", "Claude", "GPT", "Gemini"];
    try {
      const results = await Promise.all(terms.map((q) =>
        fetch(`https://hn.algolia.com/api/v1/search?tags=story&query=${encodeURIComponent(q)}&restrictSearchableAttributes=title&numericFilters=created_at_i>${since}&hitsPerPage=30`).then((r) => r.json())));
      const seen = new Set();
      const stories = results.flatMap((r) => r.hits || [])
        // Only stories really about AI: the search also matches words like "airline".
        .filter((h) => h.title && AI.test(h.title) && !seen.has(h.objectID) && seen.add(h.objectID))
        .sort((a, b) => (b.points || 0) - (a.points || 0))
        .slice(0, 12);
      list.textContent = "";
      if (!stories.length) list.innerHTML = '<div class="msg">No stories right now. Try again soon.</div>';
      stories.forEach((h, i) => {
        const a = document.createElement("a");
        a.href = h.url || `https://news.ycombinator.com/item?id=${h.objectID}`;
        a.target = "_blank";
        a.rel = "noopener";
        a.innerHTML = `<span class="rank">${i + 1}</span><div><div class="title"></div><div class="meta"></div></div>`;
        a.querySelector(".title").textContent = h.title;
        a.querySelector(".meta").textContent = `${h.points || 0} points · ${h.num_comments || 0} comments · ${host(h.url)} · ${ago(h.created_at_i)}`;
        list.append(a);
      });
      document.getElementById("sub").textContent = `Top stories, last 48 hours · updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
    } catch {
      list.innerHTML = '<div class="msg">Couldn\'t load the news. Check your connection and press ↻.</div>';
    }
    btn.classList.remove("spin");
  }
  btn.onclick = load;
  load();
  setInterval(load, 15 * 60 * 1000);
</script>
