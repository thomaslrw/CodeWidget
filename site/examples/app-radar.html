<!-- App radar: watches your app's errors in Sentry. New errors light up on the radar the moment they happen.
     Shows demo data until you connect Sentry with the gear button (your key stays on your computer). -->
<div class="w">
  <div class="radar-box"><canvas id="radar"></canvas></div>
  <div class="side">
    <div class="head">
      <div>
        <div class="t">App radar</div>
        <div class="s" id="sub">Demo data · connect Sentry with ⚙</div>
      </div>
      <div class="btns">
        <button id="refresh" title="Scan now">↻</button>
        <button id="gear" title="Connect Sentry">⚙</button>
      </div>
    </div>
    <div class="status" id="status"><span class="dot"></span><b>Scanning...</b></div>
    <div class="stats">
      <div><b id="errors">-</b><span>errors, 24h</span></div>
      <div><b id="users">-</b><span>users affected</span></div>
      <div><b id="fresh">-</b><span>new this hour</span></div>
    </div>
    <div class="list" id="list"></div>
  </div>
  <form class="settings" id="settings" hidden>
    <div class="t">Connect Sentry</div>
    <p>Create a token in Sentry (Settings, Auth Tokens) with read access, then fill this in. It's saved only on this computer.</p>
    <label>Organisation slug <input id="org" placeholder="my-company" autocomplete="off" spellcheck="false"></label>
    <label>Auth token <input id="token" type="password" placeholder="sntryu_..." autocomplete="off"></label>
    <label>Region
      <select id="region"><option value="sentry.io">US (sentry.io)</option><option value="de.sentry.io">EU (de.sentry.io)</option></select>
    </label>
    <div class="row">
      <button type="submit" class="primary">Save and scan</button>
      <button type="button" id="demo">Use demo data</button>
      <button type="button" id="close">Cancel</button>
    </div>
    <div class="err" id="err"></div>
  </form>
</div>
<style>
  * { box-sizing: border-box; }
  .w {
    height: 100vh; border-radius: 20px; background: #0d0f0e; color: #eef2ef; position: relative; overflow: hidden;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; display: flex; gap: 18px; padding: 16px 18px;
    border: 1px solid #1f2522;
  }
  .radar-box { height: 100%; aspect-ratio: 1; flex: none; position: relative; }
  canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
  .side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; }
  .t { font-weight: 700; font-size: 16px; }
  .s { color: #8b948f; font-size: 12px; margin-top: 2px; }
  .btns { display: flex; gap: 6px; }
  button { height: 30px; min-width: 30px; border-radius: 15px; background: #18201c; color: #dfe7e2; border: 1px solid #27312c; cursor: pointer; font: 13px inherit; padding: 0 9px; }
  button:hover { border-color: #39d353; color: #39d353; }
  button.spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { display: flex; align-items: center; gap: 9px; font-size: 13.5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #4b524e; flex: none; }
  .dot.ok { background: #39d353; box-shadow: 0 0 9px rgba(57, 211, 83, .6); }
  .dot.warn { background: #f5b544; box-shadow: 0 0 9px rgba(245, 181, 68, .6); animation: pulse 1.6s infinite; }
  .dot.bad { background: #f2555a; box-shadow: 0 0 9px rgba(242, 85, 90, .7); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .stats { display: flex; gap: 20px; padding-bottom: 8px; border-bottom: 1px solid #1c221f; }
  .stats b { display: block; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stats span { color: #8b948f; font-size: 10.5px; }
  .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .list a { display: flex; gap: 9px; align-items: center; padding: 6px 0; border-bottom: 1px solid #171c19; color: inherit; text-decoration: none; }
  .list a:hover .title { text-decoration: underline; }
  .list .lvl { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .list .title { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list .meta { color: #7d8681; font-size: 10.5px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list .info { flex: 1; min-width: 0; }
  .list .new { font-size: 9.5px; font-weight: 700; color: #0d0f0e; background: #f2555a; border-radius: 4px; padding: 1px 5px; }
  .empty { color: #8b948f; font-size: 12.5px; padding: 8px 0; }
  .settings {
    position: absolute; inset: 0; background: #0d0f0e; padding: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 2;
  }
  .settings[hidden] { display: none; }
  .settings p { margin: 0 0 4px; color: #8b948f; font-size: 12px; }
  label { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: #b8c0bb; }
  label input, label select {
    flex: 1; background: #151a17; color: #eef2ef; border: 1px solid #27312c; border-radius: 8px; padding: 6px 9px; font: 13px inherit; outline: none;
  }
  .row { display: flex; gap: 8px; margin-top: 4px; }
  .primary { background: #39d353; color: #07140b; border-color: #39d353; font-weight: 700; }
  .primary:hover { color: #07140b; background: #4ee067; }
  .err { color: #f2555a; font-size: 12px; min-height: 14px; }
</style>
<script>
  const KEY = "app-radar";
  const SCAN_EVERY = 120;
  let cfg = {};
  try { cfg = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
  let issues = [];
  let newIds = new Set();
  let lastScan = 0;

  const $ = (id) => document.getElementById(id);
  const ago = (t) => {
    const m = Math.round((Date.now() - t) / 60000);
    return m < 1 ? "just now" : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
  };
  // FNV-1a, so similar ids still land far apart on the radar.
  const hash = (s) => [...String(s)].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0, 2166136261);

  // ---------- Data ----------

  function demo() {
    const now = Date.now();
    const m = 60000;
    const list = [
      ["TypeError: Cannot read properties of undefined (reading 'id')", "web-app", "error", 4 * m, 37, 12],
      ["Stripe webhook timed out after 10000ms", "api", "error", 18 * m, 9, 9],
      ["Failed to fetch /api/generate", "web-app", "error", 52 * m, 64, 21],
      ["Slow DB query: users.findMany took 3.2s", "api", "warning", 95 * m, 15, 6],
      ["ResizeObserver loop limit exceeded", "web-app", "warning", 210 * m, 120, 33],
      ["Unhandled promise rejection in onboarding", "web-app", "error", 400 * m, 7, 4],
      ["Rate limit reached for OpenAI requests", "worker", "warning", 690 * m, 22, 0],
      ["Image upload failed: payload too large", "api", "error", 1100 * m, 5, 5],
    ];
    return list.map(([title, project, level, age, count, users], i) => ({
      id: `demo${i}`, title, project, level, count, users,
      firstSeen: now - age, lastSeen: now - age / 3, link: "https://sentry.io",
    }));
  }

  async function sentry(path) {
    let r;
    try {
      r = await fetch(`https://${cfg.region || "sentry.io"}/api/0${path}`, { headers: { Authorization: `Bearer ${cfg.token}` } });
    } catch {
      throw new Error("Couldn't reach Sentry. Check the organisation slug, the region and your connection.");
    }
    if (r.status === 401 || r.status === 403) throw new Error("Sentry didn't accept that token. Check it has read access.");
    if (r.status === 404) throw new Error("Couldn't find that organisation. Check the slug and region.");
    if (!r.ok) throw new Error(`Sentry said ${r.status}. Try again in a minute.`);
    return r.json();
  }

  async function scan() {
    $("refresh").classList.add("spin");
    const before = new Set(issues.map((x) => x.id));
    try {
      if (!cfg.token || !cfg.org) {
        issues = demo();
        $("sub").textContent = "Demo data · connect Sentry with ⚙";
      } else {
        const raw = await sentry(`/organizations/${encodeURIComponent(cfg.org)}/issues/?query=is%3Aunresolved&statsPeriod=24h&sort=date&limit=25`);
        issues = raw.map((x) => ({
          id: x.id, title: x.title, project: x.project?.slug || "", level: x.level,
          count: Number(x.count) || 0, users: Number(x.userCount) || 0,
          firstSeen: Date.parse(x.firstSeen), lastSeen: Date.parse(x.lastSeen), link: x.permalink,
        }));
        $("sub").textContent = `${cfg.org} · scanned ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
      }
      // Anything not seen on the last scan (or first seen in the last hour) counts as new.
      newIds = new Set(issues.filter((x) => (lastScan && !before.has(x.id)) || Date.now() - x.firstSeen < 3600000).map((x) => x.id));
      lastScan = Date.now();
      show();
    } catch (e) {
      $("status").innerHTML = '<span class="dot bad"></span><b></b>';
      $("status").querySelector("b").textContent = e.message || "Couldn't reach Sentry.";
    }
    $("refresh").classList.remove("spin");
  }

  function show() {
    const errors = issues.reduce((n, x) => n + x.count, 0);
    const users = issues.reduce((n, x) => n + x.users, 0);
    $("errors").textContent = errors.toLocaleString();
    $("users").textContent = users.toLocaleString();
    $("fresh").textContent = newIds.size;
    const bad = issues.some((x) => newIds.has(x.id) && x.level === "error");
    const st = $("status");
    st.innerHTML = `<span class="dot ${bad ? "bad" : newIds.size ? "warn" : "ok"}"></span><b></b>`;
    st.querySelector("b").textContent = !issues.length
      ? "All clear. Nothing on the radar."
      : newIds.size
        ? `${newIds.size} new ${newIds.size === 1 ? "issue" : "issues"} in the last hour`
        : `${issues.length} open, nothing new`;
    const list = $("list");
    list.textContent = "";
    if (!issues.length) list.innerHTML = '<div class="empty">No unresolved issues in the last 24 hours.</div>';
    issues.slice(0, 8).forEach((x) => {
      const a = document.createElement("a");
      a.href = x.link;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = '<span class="lvl"></span><div class="info"><div class="title"></div><div class="meta"></div></div>';
      a.querySelector(".lvl").style.background = x.level === "error" || x.level === "fatal" ? "#f2555a" : "#f5b544";
      a.querySelector(".title").textContent = x.title;
      a.querySelector(".meta").textContent = `${x.project} · ${x.count} events · ${ago(x.lastSeen)}`;
      if (newIds.has(x.id)) {
        const n = document.createElement("span");
        n.className = "new";
        n.textContent = "NEW";
        a.append(n);
      }
      list.append(a);
    });
  }

  // ---------- The radar ----------

  const canvas = $("radar");
  const ctx = canvas.getContext("2d");
  function frame(t) {
    const dpr = window.devicePixelRatio || 1;
    const size = canvas.clientWidth;
    if (canvas.width !== size * dpr) { canvas.width = canvas.height = size * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const c = size / 2;
    const r = c - 4;
    ctx.clearRect(0, 0, size, size);

    // Rings and cross lines.
    ctx.strokeStyle = "rgba(57, 211, 83, 0.16)";
    ctx.lineWidth = 1;
    for (let i = 1; i <= 4; i++) { ctx.beginPath(); ctx.arc(c, c, (r * i) / 4, 0, Math.PI * 2); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(c - r, c); ctx.lineTo(c + r, c); ctx.moveTo(c, c - r); ctx.lineTo(c, c + r); ctx.stroke();

    // The sweep: one turn every 4 seconds, with a fading trail.
    const angle = ((t / 4000) % 1) * Math.PI * 2;
    for (let i = 0; i < 40; i++) {
      const a = angle - i * 0.02;
      ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, r, a - 0.022, a); ctx.closePath();
      ctx.fillStyle = `rgba(57, 211, 83, ${0.22 * (1 - i / 40)})`;
      ctx.fill();
    }

    // Blips: one per issue. Newer issues sit nearer the centre, bigger blips have more events.
    // Each glows brightly as the sweep passes over it, then fades.
    const max = Math.max(1, ...issues.map((x) => x.count));
    for (const x of issues) {
      const h = hash(x.id);
      const ba = ((h % 1000) / 1000) * Math.PI * 2;
      const hours = Math.min(24, Math.max(0, (Date.now() - x.firstSeen) / 3600000));
      const dist = r * (0.16 + 0.78 * Math.sqrt(hours / 24));
      const bx = c + Math.cos(ba) * dist;
      const by = c + Math.sin(ba) * dist;
      const since = ((angle - ba) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      const glow = Math.max(0.25, 1 - since / (Math.PI * 2));
      const isNew = newIds.has(x.id);
      const colour = x.level === "error" || x.level === "fatal" ? "242, 85, 90" : "245, 181, 68";
      const rad = 2.5 + 4.5 * Math.sqrt(x.count / max);
      if (isNew) {
        const pulse = (t / 900) % 1;
        ctx.beginPath(); ctx.arc(bx, by, rad + pulse * 14, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${colour}, ${0.6 * (1 - pulse)})`; ctx.lineWidth = 1.5; ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(bx, by, rad, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${colour}, ${glow})`;
      ctx.shadowColor = `rgba(${colour}, ${glow})`; ctx.shadowBlur = 10 * glow;
      ctx.fill(); ctx.shadowBlur = 0;
    }

    // Centre: your app.
    ctx.beginPath(); ctx.arc(c, c, 3, 0, Math.PI * 2); ctx.fillStyle = "#39d353"; ctx.fill();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- Settings ----------

  const form = $("settings");
  $("gear").onclick = () => {
    $("org").value = cfg.org || "";
    $("token").value = cfg.token || "";
    $("region").value = cfg.region || "sentry.io";
    $("err").textContent = "";
    form.hidden = false;
  };
  $("close").onclick = () => (form.hidden = true);
  $("demo").onclick = () => {
    cfg = {};
    try { localStorage.removeItem(KEY); } catch {}
    form.hidden = true;
    lastScan = 0;
    scan();
  };
  form.onsubmit = async (e) => {
    e.preventDefault();
    const next = { org: $("org").value.trim(), token: $("token").value.trim(), region: $("region").value };
    if (!next.org || !next.token) return ($("err").textContent = "Fill in both the organisation and the token.");
    const old = cfg;
    cfg = next;
    try {
      await sentry(`/organizations/${encodeURIComponent(cfg.org)}/issues/?limit=1&statsPeriod=24h`);
    } catch (err) {
      cfg = old;
      return ($("err").textContent = err.message || "Couldn't reach Sentry.");
    }
    try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch {}
    form.hidden = true;
    lastScan = 0;
    issues = [];
    scan();
  };

  $("refresh").onclick = scan;
  scan();
  setInterval(scan, SCAN_EVERY * 1000);
</script>
