<!-- AI orb: ask Claude, ChatGPT or any model a question right from your desktop. Add your own API key with the
     gear button (it's saved only on this computer). Until then it plays a short demo. -->
<div class="w">
  <div class="head">
    <div><div class="t">AI orb</div><div class="s" id="sub">Demo · add your API key with ⚙</div></div>
    <button id="gear" title="Settings">⚙</button>
  </div>
  <div class="stage"><canvas id="orb"></canvas></div>
  <div class="answer" id="answer"></div>
  <form class="ask" id="ask">
    <input id="q" placeholder="Ask anything..." autocomplete="off">
    <button type="submit" class="send" title="Ask">↑</button>
  </form>
  <form class="settings" id="settings" hidden>
    <div class="t">Connect your AI</div>
    <p>Your key is saved only on this computer and goes straight to the provider.</p>
    <label>Provider
      <select id="provider">
        <option value="anthropic">Claude (Anthropic)</option>
        <option value="openai">ChatGPT (OpenAI)</option>
        <option value="openrouter">Any model (OpenRouter)</option>
      </select>
    </label>
    <label>API key<input id="key" type="password" autocomplete="off" placeholder="Paste your key"></label>
    <label>Model<input id="model" autocomplete="off" spellcheck="false"></label>
    <div class="row">
      <button type="submit" class="primary">Save</button>
      <button type="button" id="forget">Remove key</button>
      <button type="button" id="close">Cancel</button>
    </div>
  </form>
</div>
<style>
  * { box-sizing: border-box; }
  .w {
    height: 100vh; padding: 16px; border-radius: 20px; background: #000; color: #f1f1f4; position: relative; overflow: hidden;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; gap: 10px;
    border: 1px solid #1f1f24;
  }
  .head { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 1; }
  .t { font-weight: 700; font-size: 16px; }
  .s { color: #8d8d99; font-size: 12px; margin-top: 2px; }
  button { height: 30px; min-width: 30px; border-radius: 15px; background: #15151b; color: #e3e3ea; border: 1px solid #2a2a33; cursor: pointer; font: 13px inherit; padding: 0 9px; }
  button:hover { border-color: #a78bfa; color: #c4b5fd; }
  .stage { flex: 1; min-height: 120px; position: relative; display: flex; align-items: center; justify-content: center; }
  canvas { width: 100%; height: 100%; display: block; }
  .answer {
    min-height: 74px; max-height: 128px; overflow-y: auto; font-size: 13px; line-height: 1.5; color: #d9d9e3;
    white-space: pre-wrap; padding: 2px 2px 0;
  }
  .answer .q { color: #8d8d99; font-size: 12px; margin-bottom: 4px; }
  .answer .cursor::after { content: "▍"; color: #c4b5fd; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .ask { display: flex; gap: 8px; background: #101015; border: 1px solid #26262e; border-radius: 14px; padding: 6px 6px 6px 12px; }
  .ask:focus-within { border-color: #7c6cf2; }
  .ask input { flex: 1; background: none; border: 0; outline: none; color: #f1f1f4; font: 13.5px inherit; min-width: 0; }
  .send { background: #f1f1f4; color: #000; border: 0; font-weight: 700; font-size: 15px; }
  .send:hover { background: #fff; color: #000; }
  .settings { position: absolute; inset: 0; background: #000; padding: 16px; display: flex; flex-direction: column; gap: 9px; z-index: 3; }
  .settings[hidden] { display: none; }
  .settings p { margin: 0; color: #8d8d99; font-size: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #b3b3c0; }
  label input, label select { width: 100%; background: #101015; color: #f1f1f4; border: 1px solid #2a2a33; border-radius: 8px; padding: 7px 9px; font: 13px inherit; outline: none; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .primary { background: #a78bfa; border-color: #a78bfa; color: #0b0614; font-weight: 700; }
  .primary:hover { background: #c4b5fd; color: #0b0614; }
</style>
<script>
  const KEY = "ai-orb";
  const MODELS = { anthropic: "claude-sonnet-5-5", openai: "gpt-6.2-sol", openrouter: "anthropic/claude-sonnet-5.5" };
  let cfg = {};
  try { cfg = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
  const $ = (id) => document.getElementById(id);
  let thinking = 0; // 0 idle, 1 thinking, 2 talking

  // ---------- The orb: layered glowing blobs that drift, and swirl faster while it thinks ----------
  const canvas = $("orb");
  const ctx = canvas.getContext("2d");
  let energy = 0;
  function frame(t) {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== w * dpr || canvas.height !== h * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    energy += ((thinking ? 1 : 0) - energy) * 0.05;
    const cx = w / 2, cy = h / 2;
    const r = Math.min(w, h) * 0.34 * (1 + Math.sin(t / 900) * 0.03 + energy * 0.06 * Math.sin(t / 120));
    const speed = 1 + energy * 4;
    // Outer glow.
    const glow = ctx.createRadialGradient(cx, cy, r * 0.4, cx, cy, r * 1.9);
    glow.addColorStop(0, `rgba(139, 92, 246, ${0.35 + energy * 0.2})`);
    glow.addColorStop(1, "rgba(139, 92, 246, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);
    // The sphere, clipped, with moving colour blobs inside.
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = "#0d0820"; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    ctx.globalCompositeOperation = "lighter";
    const blobs = [["124, 108, 242", 0], ["236, 72, 153", 2.1], ["56, 189, 248", 4.2], ["167, 139, 250", 1.1]];
    for (const [rgb, off] of blobs) {
      const a = (t / 1000) * 0.6 * speed + off;
      const bx = cx + Math.cos(a) * r * 0.45, by = cy + Math.sin(a * 1.3) * r * 0.45;
      const g = ctx.createRadialGradient(bx, by, 0, bx, by, r * 0.95);
      g.addColorStop(0, `rgba(${rgb}, 0.85)`); g.addColorStop(1, `rgba(${rgb}, 0)`);
      ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
    ctx.restore();
    // Glass highlight and rim.
    const hl = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.45, 0, cx - r * 0.35, cy - r * 0.45, r * 0.7);
    hl.addColorStop(0, "rgba(255,255,255,0.35)"); hl.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = hl; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.lineWidth = 1; ctx.stroke();
    // Rings ripple out while it thinks.
    if (energy > 0.05) {
      for (let i = 0; i < 3; i++) {
        const p = ((t / 1400) + i / 3) % 1;
        ctx.beginPath(); ctx.arc(cx, cy, r * (1 + p * 0.7), 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(196, 181, 253, ${(1 - p) * 0.35 * energy})`; ctx.lineWidth = 1.5; ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- Asking ----------
  const answer = $("answer");
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function type(text) {
    thinking = 2;
    const out = answer.querySelector(".a");
    out.classList.add("cursor");
    for (let i = 0; i < text.length; i += 2) {
      out.textContent = text.slice(0, i + 2);
      answer.scrollTop = answer.scrollHeight;
      await sleep(12);
    }
    out.classList.remove("cursor");
    thinking = 0;
  }

  function show(question) {
    answer.innerHTML = '<div class="q"></div><div class="a cursor"></div>';
    answer.querySelector(".q").textContent = question;
  }

  async function callAI(question) {
    const model = cfg.model || MODELS[cfg.provider];
    if (cfg.provider === "anthropic") {
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json", "x-api-key": cfg.key, "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({ model, max_tokens: 500, system: "You live in a small desktop widget. Answer in a few short, plain sentences.", messages: [{ role: "user", content: question }] }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error?.message || `Error ${r.status}`);
      return j.content.map((c) => c.text || "").join("").trim();
    }
    const url = cfg.provider === "openrouter" ? "https://openrouter.ai/api/v1/chat/completions" : "https://api.openai.com/v1/chat/completions";
    const r = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json", Authorization: `Bearer ${cfg.key}` },
      body: JSON.stringify({ model, messages: [
        { role: "system", content: "You live in a small desktop widget. Answer in a few short, plain sentences." },
        { role: "user", content: question },
      ] }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || `Error ${r.status}`);
    return (j.choices?.[0]?.message?.content || "").trim();
  }

  const DEMO = [
    ["Explain RAG in one line", "RAG means the AI looks things up in your own documents first, then answers using what it found, so it's grounded in your data instead of guessing."],
    ["Give me a hook for my app launch video", "\"I built this in 30 days with no team, and it already does the one thing you hate doing every morning.\""],
  ];

  $("ask").onsubmit = async (e) => {
    e.preventDefault();
    const question = $("q").value.trim();
    if (!question || thinking) return;
    $("q").value = "";
    show(question);
    thinking = 1;
    if (!cfg.key) {
      await sleep(900);
      await type("Add your Claude, ChatGPT or OpenRouter key with ⚙ and I'll answer anything, right here on your desktop.");
      return;
    }
    try {
      const text = await callAI(question);
      await type(text || "No answer came back. Try again.");
    } catch (err) {
      await type(`Couldn't get an answer: ${err.message}`);
    }
  };

  // Demo: a short conversation plays when there's no key yet.
  async function demo() {
    for (const [q, a] of DEMO) {
      if (cfg.key) return;
      show(q);
      thinking = 1;
      await sleep(1300);
      await type(a);
      await sleep(4500);
    }
  }

  // ---------- Settings ----------
  const form = $("settings");
  const label = () => {
    $("sub").textContent = cfg.key
      ? `${{ anthropic: "Claude", openai: "ChatGPT", openrouter: "OpenRouter" }[cfg.provider]} · ${cfg.model || MODELS[cfg.provider]}`
      : "Demo · add your API key with ⚙";
  };
  $("provider").onchange = () => ($("model").value = MODELS[$("provider").value]);
  $("gear").onclick = () => {
    $("provider").value = cfg.provider || "anthropic";
    $("key").value = cfg.key || "";
    $("model").value = cfg.model || MODELS[cfg.provider || "anthropic"];
    form.hidden = false;
  };
  $("close").onclick = () => (form.hidden = true);
  $("forget").onclick = () => {
    cfg = {};
    try { localStorage.removeItem(KEY); } catch {}
    form.hidden = true;
    label();
  };
  form.onsubmit = (e) => {
    e.preventDefault();
    cfg = { provider: $("provider").value, key: $("key").value.trim(), model: $("model").value.trim() };
    try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch {}
    form.hidden = true;
    label();
    $("q").focus();
  };
  label();
  if (!cfg.key) demo();
</script>
