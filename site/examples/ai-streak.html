<!-- AI shipping streak: a year of days you built something with AI. Click a day to change it (none, light, medium, heavy, all-in). -->
<div class="w">
  <div class="top">
    <div>
      <div class="t">AI shipping streak</div>
      <div class="s" id="sub">Days I built something with AI</div>
    </div>
    <div class="stats">
      <div><b id="cur">0</b><span>current streak</span></div>
      <div><b id="best">0</b><span>longest streak</span></div>
      <div><b id="total">0</b><span>days in the last year</span></div>
    </div>
  </div>
  <div class="months" id="months"></div>
  <div class="grid" id="grid"></div>
  <div class="bottom">
    <div class="trend">
      <div class="trend-head"><span>Monthly trend</span><b id="change"></b></div>
      <div class="bars" id="bars"></div>
    </div>
    <div class="side">
      <div class="legend">Less <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> More</div>
      <button id="reset" hidden>Clear example data</button>
    </div>
  </div>
</div>
<style>
  * { box-sizing: border-box; }
  .w {
    height: 100vh; padding: 18px 20px; border-radius: 20px; background: #0d0f0e; color: #eef2ef;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; gap: 10px;
    border: 1px solid #1f2522;
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .t { font-weight: 700; font-size: 16px; }
  .s { color: #8b948f; font-size: 12px; margin-top: 2px; }
  .stats { display: flex; gap: 18px; text-align: right; }
  .stats b { display: block; font-size: 20px; line-height: 1.1; }
  .stats span { color: #8b948f; font-size: 10.5px; }
  .months { display: grid; grid-template-columns: repeat(53, 1fr); gap: 3px; font-size: 9.5px; color: #77807b; height: 12px; }
  .grid { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; flex: 1; min-height: 0; }
  .grid i { border-radius: 2.5px; cursor: pointer; min-height: 6px; }
  .grid i:hover { outline: 1px solid #fff; }
  .grid i.today { outline: 1.5px solid #eef2ef; }
  .grid i.future { background: transparent !important; cursor: default; outline: none; }
  .l0 { background: #1a1f1c; } .l1 { background: #0e4429; } .l2 { background: #006d32; } .l3 { background: #26a641; } .l4 { background: #39d353; }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .trend { flex: 1; max-width: 360px; }
  .trend-head { display: flex; gap: 8px; align-items: baseline; font-size: 11px; color: #8b948f; margin-bottom: 4px; }
  .trend-head b { color: #39d353; font-size: 11px; }
  .trend-head b.down { color: #f2785c; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 30px; }
  .bars div { flex: 1; background: #26a641; border-radius: 2px 2px 0 0; min-height: 2px; opacity: .85; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .legend { display: flex; align-items: center; gap: 3px; font-size: 10.5px; color: #77807b; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  button { background: #1a1f1c; color: #b8c0bb; border: 1px solid #2a312d; border-radius: 6px; padding: 3px 8px; font: 11px inherit; cursor: pointer; }
  button:hover { color: #fff; }
</style>
<script>
  const KEY = "ai-streak";
  const DAY = 86400000;
  const pad = (n) => String(n).padStart(2, "0");
  const key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = new Date(); today.setHours(0, 0, 0, 0);

  // 53 weeks ending this week (Monday to Sunday).
  const end = new Date(today); end.setDate(end.getDate() + (6 - ((today.getDay() + 6) % 7)));
  const start = new Date(end.getTime() - (53 * 7 - 1) * DAY);
  const days = [];
  for (let t = start.getTime(); t <= end.getTime(); t += DAY) days.push(new Date(t));

  // Example data: more AI building as the year goes on, quieter weekends. Replaced as soon as you click a day.
  function example() {
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const data = {};
    days.forEach((d, i) => {
      if (d > today) return;
      const progress = i / days.length;
      const weekend = d.getDay() === 0 || d.getDay() === 6;
      const chance = 0.35 + progress * 0.55 - (weekend ? 0.2 : 0);
      if (rnd() < chance) data[key(d)] = Math.min(4, 1 + Math.floor(rnd() * (1.5 + progress * 3)));
    });
    return data;
  }

  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY)); } catch {}
  let isExample = !saved;
  let data = saved || example();

  function save() {
    isExample = false;
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
  }

  const grid = document.getElementById("grid");
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  function draw() {
    grid.textContent = "";
    days.forEach((d) => {
      const cell = document.createElement("i");
      const level = data[key(d)] || 0;
      cell.className = `l${level}` + (d > today ? " future" : "") + (d.getTime() === today.getTime() ? " today" : "");
      cell.title = `${d.toDateString()}${level ? `: level ${level}` : ""}`;
      if (d <= today) cell.onclick = () => {
        data[key(d)] = ((data[key(d)] || 0) + 1) % 5;
        if (!data[key(d)]) delete data[key(d)];
        save();
        draw();
      };
      grid.append(cell);
    });

    const months = document.getElementById("months");
    months.textContent = "";
    for (let w = 0; w < 53; w++) {
      const first = days[w * 7];
      const s = document.createElement("span");
      const prev = w ? days[(w - 1) * 7] : null;
      s.textContent = !prev || prev.getMonth() !== first.getMonth() ? MONTHS[first.getMonth()] : "";
      months.append(s);
    }

    // Streaks and totals.
    const on = (d) => !!data[key(d)];
    let cur = 0;
    const c = new Date(today);
    if (!on(c)) c.setDate(c.getDate() - 1);
    while (c >= start && on(c)) { cur++; c.setDate(c.getDate() - 1); }
    let best = 0, run = 0, total = 0;
    days.forEach((d) => { if (d > today) return; if (on(d)) { run++; total++; best = Math.max(best, run); } else run = 0; });
    document.getElementById("cur").textContent = cur;
    document.getElementById("best").textContent = best;
    document.getElementById("total").textContent = total;

    // Active days in each of the last 12 months, and the change on the month before.
    const counts = [];
    for (let m = 11; m >= 0; m--) {
      const from = new Date(today.getFullYear(), today.getMonth() - m, 1);
      const to = new Date(today.getFullYear(), today.getMonth() - m + 1, 1);
      counts.push(days.filter((d) => d >= from && d < to && d <= today && on(d)).length);
    }
    const max = Math.max(1, ...counts);
    const bars = document.getElementById("bars");
    bars.textContent = "";
    counts.forEach((n, i) => {
      const b = document.createElement("div");
      b.style.height = `${(n / max) * 100}%`;
      const mi = (today.getMonth() - 11 + i + 12) % 12;
      b.title = `${MONTHS[mi]}: ${n} days`;
      bars.append(b);
    });
    // Compare this month so far with the same number of days last month.
    const dayOfMonth = today.getDate();
    const sameSpan = (y, m) => days.filter((d) => d.getFullYear() === y && d.getMonth() === m && d.getDate() <= dayOfMonth && d <= today && on(d)).length;
    const lm = new Date(today.getFullYear(), today.getMonth() - 1, 1);
    const now = sameSpan(today.getFullYear(), today.getMonth());
    const before = sameSpan(lm.getFullYear(), lm.getMonth());
    const ch = document.getElementById("change");
    if (before) {
      const pct = Math.round(((now - before) / before) * 100);
      ch.textContent = `${pct >= 0 ? "+" : ""}${pct}% vs last month`;
      ch.className = pct < 0 ? "down" : "";
    } else ch.textContent = "";

    document.getElementById("sub").textContent = isExample ? "Example data. Click any day to start your own." : "Days I built something with AI";
    document.getElementById("reset").hidden = !isExample;
  }

  document.getElementById("reset").onclick = () => { data = {}; save(); draw(); };
  draw();
</script>
