<!-- Prompt library: your best AI prompts, one click to copy. Add your own with +. -->
<div class="w">
  <div class="head">
    <div><div class="t">Prompt library</div><div class="s">Click a prompt to copy it</div></div>
    <button id="toggle" title="Add a prompt">+</button>
  </div>
  <form id="form" hidden>
    <input id="title" placeholder="Name, e.g. Explain like I'm new" maxlength="60" required>
    <textarea id="text" placeholder="The prompt" rows="3" required></textarea>
    <button type="submit">Save prompt</button>
  </form>
  <div class="list" id="list"></div>
  <div class="toast" id="toast">Copied</div>
</div>
<style>
  * { box-sizing: border-box; }
  .w {
    height: 100vh; padding: 16px; border-radius: 20px; background: #101012; color: #f1f1f3; position: relative;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; gap: 10px;
    border: 1px solid #222226; overflow: hidden;
  }
  .head { display: flex; justify-content: space-between; align-items: center; }
  .t { font-weight: 700; font-size: 16px; }
  .s { color: #8d8d96; font-size: 12px; margin-top: 2px; }
  #toggle { width: 30px; height: 30px; border-radius: 50%; font-size: 18px; line-height: 1; }
  button { background: #1d1d21; color: #e8e8ec; border: 1px solid #2c2c32; border-radius: 8px; padding: 6px 10px; font: 13px inherit; cursor: pointer; }
  button:hover { border-color: #55555e; }
  form { display: flex; flex-direction: column; gap: 6px; }
  form[hidden] { display: none; }
  input, textarea {
    background: #18181c; color: #f1f1f3; border: 1px solid #2c2c32; border-radius: 8px; padding: 7px 9px;
    font: 13px -apple-system, "Segoe UI", system-ui, sans-serif; resize: none; outline: none;
  }
  .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; }
  .item { position: relative; padding: 9px 30px 9px 11px; border-radius: 10px; background: #18181c; border: 1px solid #232328; cursor: pointer; }
  .item:hover { border-color: #44444c; background: #1c1c21; }
  .item b { display: block; font-size: 13px; }
  .item p { margin: 3px 0 0; color: #9a9aa3; font-size: 11.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .x { position: absolute; top: 6px; right: 6px; border: 0; background: none; color: #6b6b74; padding: 2px 6px; font-size: 14px; }
  .item .x:hover { color: #fff; }
  .toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s; background: #f1f1f3; color: #111; font-weight: 600; font-size: 12px; padding: 6px 12px; border-radius: 8px; pointer-events: none; }
  .toast.on { opacity: 1; transform: translateX(-50%); }
</style>
<script>
  const KEY = "prompt-library";
  const STARTERS = [
    { title: "Explain like I'm new", text: "Explain this to me like I'm completely new to it. Use a simple example, then tell me the one thing most beginners get wrong:\n\n" },
    { title: "Make it sharper", text: "Rewrite this to be clearer and shorter. Keep my voice, cut anything that doesn't earn its place, and don't add new ideas:\n\n" },
    { title: "Find the holes", text: "Act as a sceptical expert. List the 5 biggest weaknesses or risks in this, most serious first, and how to fix each:\n\n" },
    { title: "Turn into a plan", text: "Turn this into a step-by-step plan I can start today. Short steps, in order, with what 'done' looks like for each:\n\n" },
    { title: "Build me a widget", text: "Make me a desktop widget as ONE self-contained HTML file (HTML, CSS and JavaScript inline). Fill the whole window, rounded background, save data with localStorage. The widget: " },
  ];
  let items;
  try { items = JSON.parse(localStorage.getItem(KEY)); } catch {}
  if (!Array.isArray(items)) items = STARTERS;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {} };

  const toast = document.getElementById("toast");
  function flash(t) { toast.textContent = t; toast.classList.add("on"); clearTimeout(flash.t); flash.t = setTimeout(() => toast.classList.remove("on"), 1200); }

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
    const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  }

  function draw() {
    const list = document.getElementById("list");
    list.textContent = "";
    items.forEach((p, i) => {
      const el = document.createElement("div");
      el.className = "item";
      const b = document.createElement("b"); b.textContent = p.title;
      const d = document.createElement("p"); d.textContent = p.text;
      const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.title = "Delete";
      x.onclick = (e) => { e.stopPropagation(); items.splice(i, 1); save(); draw(); };
      el.onclick = async () => flash((await copy(p.text)) ? "Copied" : "Couldn't copy");
      el.append(b, d, x);
      list.append(el);
    });
  }

  const form = document.getElementById("form");
  document.getElementById("toggle").onclick = () => { form.hidden = !form.hidden; if (!form.hidden) document.getElementById("title").focus(); };
  form.onsubmit = (e) => {
    e.preventDefault();
    items.unshift({ title: document.getElementById("title").value.trim(), text: document.getElementById("text").value });
    save(); form.reset(); form.hidden = true; draw(); flash("Saved");
  };
  draw();
</script>
